name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Gigalixir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gigalixir CLI
        run: pipx install gigalixir

      - name: Log in to Gigalixir
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
        run: |
          gigalixir login -e "$GIGALIXIR_EMAIL" -y -p "$GIGALIXIR_API_KEY"
          chmod 600 ~/.netrc

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          printf 'Host *.ssh.gigalixir.com\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          gigalixir account:ssh_keys:add "$(cat ~/.ssh/id_ed25519.pub)"

      - name: Add Gigalixir git remote
        run: git remote add gigalixir https://git.gigalixir.com/unclickbaiter.git

      - name: Push to Gigalixir
        run: git push gigalixir HEAD:refs/heads/main

      - name: Run migrations
        run: gigalixir ps:migrate
