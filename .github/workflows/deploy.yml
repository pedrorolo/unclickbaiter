name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Gigalixir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gigalixir CLI
        run: pipx install gigalixir

      - name: Log in to Gigalixir
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
        run: |
          gigalixir login -e "$GIGALIXIR_EMAIL" -y -p "$GIGALIXIR_API_KEY"
          chmod 600 ~/.netrc

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          printf 'Host *.ssh.gigalixir.com\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          gigalixir account:ssh_keys:add "$(cat ~/.ssh/id_ed25519.pub)"

      - name: Add Gigalixir git remote
        run: git remote add gigalixir https://git.gigalixir.com/unclickbaiter.git

      - name: Capture current release version
        id: before
        run: |
          version="$(gigalixir ps 2>/dev/null | awk 'NR==2{print $2}')"
          echo "previous_version=$version" >> "$GITHUB_OUTPUT"

      - name: Push to Gigalixir
        run: git push gigalixir HEAD:refs/heads/main

      - name: Wait for the new release to be online
        env:
          PREV_VERSION: ${{ steps.before.outputs.previous_version }}
        run: |
          for i in $(seq 1 60); do
            output="$(gigalixir ps 2>/dev/null || true)"
            version="$(echo "$output" | awk 'NR==2{print $2}')"

            if echo "$output" | grep -qiE "Running|up|healthy"; then
              if [ -n "$PREV_VERSION" ] && [ "$version" != "$PREV_VERSION" ]; then
                echo "New release ($version) is online."
                exit 0
              fi

              if [ -z "$PREV_VERSION" ]; then
                echo "App is online."
                exit 0
              fi

              echo "Old release still serving; waiting for the new release..."
            else
              echo "App not yet online (attempt $i/60)..."
            fi

            sleep 10
          done

          echo "New app did not come online; aborting before running migrations."
          exit 1

      - name: Run migrations
        run: gigalixir ps:migrate
