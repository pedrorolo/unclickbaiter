name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Gigalixir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gigalixir CLI
        run: pipx install gigalixir

      - name: Log in to Gigalixir
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
        run: |
          gigalixir login -e "$GIGALIXIR_EMAIL" -y -p "$GIGALIXIR_API_KEY"
          chmod 600 ~/.netrc

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          printf 'Host *.ssh.gigalixir.com\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          gigalixir account:ssh_keys:add "$(cat ~/.ssh/id_ed25519.pub)"

      - name: Add Gigalixir git remote
        run: git remote add gigalixir https://git.gigalixir.com/unclickbaiter.git

      - name: Capture deployed commit SHA
        id: deploy
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push to Gigalixir
        run: git push gigalixir HEAD:refs/heads/main

      - name: Wait for the new release to be healthy
        env:
          DEPLOYED_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          for i in $(seq 1 60); do
            status="$(gigalixir ps 2>/dev/null || true)"
            healthy="$(echo "$status" | jq -r --arg sha "$DEPLOYED_SHA" '
              [.pods[]? | select(.sha == $sha and ((.status // "") | ascii_downcase | startswith("healthy")))] | length
            ' 2>/dev/null || echo 0)"

            if [ "${healthy:-0}" -gt 0 ]; then
              echo "New release ($DEPLOYED_SHA) is healthy."
              exit 0
            fi

            echo "Waiting for the new release to become healthy (attempt $i/60)..."
            sleep 10
          done

          echo "New release did not become healthy; aborting before running migrations."
          exit 1

      - name: Run migrations
        run: gigalixir ps:migrate
