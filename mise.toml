# mise.toml — tooling environment for this project
# Defines language/tool runtimes to be installed/used by automation.

[tools.pipx]
# Use the latest pipx available
version = "1.16.6"
# CLI packages to install globally (via pipx).
# Note: tool 'ise' may not accept a 'packages' field here; listing removed to avoid warnings.
# Recommended: install via pipx manually (e.g., pipx install gigalixir)


[tools.elixir]
# Request the latest Elixir release
version = "1.20.3"
# Install the latest compatible Erlang/OTP runtime
otp = "29.0.5"
# Default mix environment to use when running mix tasks
mix_env = "dev"

[tools.npm]
# Request the explicit npm release
version = "12.0.2"
# Global npm packages to install
# Note: 'packages' field removed to avoid mise/ise warnings. Install esbuild via npm if needed (npm install -g esbuild)


# Apt packages (removed 'packages' field to avoid warnings)
# Recommended manual install on Debian/Ubuntu: sudo apt-get install -y inotify-tools

